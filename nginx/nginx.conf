server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Standalone share HTML (published decks, case studies, slides).
  # Never SPA-fallback these to index.html, or a missing file shows the
  # app's home page instead of a 404.
  location ~* \.html$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
  }

  # Hash-routed Design Harness app + static assets under /assets/.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
