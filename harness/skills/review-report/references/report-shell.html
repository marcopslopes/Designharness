<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title><!-- TITLE --></title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400..700&display=swap" rel="stylesheet" />
  <style>
    /* Mirrors context/design-system/tokens.css. Values are copied so this file
       still opens on its own. Update both when those tokens change. */
    :root {
      --ink: #14161a;            /* --color-text-default */
      --secondary: #4b5563;      /* --color-text-secondary */
      --muted: #6b7280;          /* --color-text-muted */
      --line: #e5e7eb;           /* --kit-ink-15 */
      --bg: #f5f5f5;             /* --color-surface-muted */
      --paper: #ffffff;          /* --color-surface-default */
      --accent: #007078;         /* --color-surface-brand */
      --error: #951c13;          /* --color-text-error */
      --error-bg: #f9e3df;       /* --color-surface-error */
      --warning: #b86a00;        /* --ds-additional-content-warning */
      --warning-bg: #faefd7;     /* --color-surface-warning */
      --success: #258438;        /* --color-text-success */
      --success-bg: #dff5e4;     /* --color-surface-success */
      --font: 'Inter', system-ui, -apple-system, sans-serif; /* --font-family-text */
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      font-size: 16px;           /* --font-size-body */
      line-height: 1.6;          /* --kit-font-body-line */
      font-weight: 400;
    }
    .bar {
      background: var(--paper);
      color: var(--secondary);
      border-bottom: 1px solid var(--line);
      padding: 12px 24px;        /* --spacing-04 / --spacing-06 */
      font-size: 13px;           /* --kit-font-caption-size */
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: center;
    }
    .bar a { color: var(--accent); }
    article {
      max-width: 760px;
      margin: 40px auto 80px;    /* --spacing-08 */
      background: var(--paper);
      padding: 40px 40px 64px;
      border: 1px solid var(--line);
      border-radius: 8px;        /* --radius-02 */
    }
    h1 { font-size: 32px; font-weight: 400; line-height: 1.2; margin: 0 0 12px; } /* --kit-font-headline */
    h2 { font-size: 20px; font-weight: 500; margin: 40px 0 12px; }                 /* --kit-font-title */
    h3 { font-size: 16px; font-weight: 500; margin: 24px 0 8px; }
    p, li { font-size: 16px; }
    em { color: var(--muted); }
    hr { border: 0; border-top: 1px solid var(--line); margin: 40px 0; }
    img { max-width: 100%; height: auto; display: block; margin: 24px 0; border: 1px solid var(--line); border-radius: 8px; }
    figure { margin: 24px 0; }
    figure img {
      margin: 0;
      width: 100%;
      max-height: 520px;
      object-fit: cover;
      object-position: top;
    }
    figcaption { font-size: 13px; color: var(--muted); margin-top: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; margin: 16px 0 24px; }
    th, td { text-align: left; border-bottom: 1px solid var(--line); padding: 12px; vertical-align: top; }
    th { color: var(--secondary); font-weight: 500; }
    a { color: var(--accent); }
    code { font-size: 0.88em; background: var(--bg); padding: 0.1em 0.35em; border-radius: 4px; }
    .meta { font-size: 13px; color: var(--muted); line-height: 1.6; }
    .meta strong { color: var(--ink); font-weight: 500; }
    .badge { display: inline-block; font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 8px; }
    .badge-high, .badge-p1 { background: var(--error-bg); color: var(--error); }
    .badge-med, .badge-p2 { background: var(--warning-bg); color: var(--warning); }
    .badge-low { background: var(--success-bg); color: var(--success); }
    .badge-p3 { background: var(--bg); color: var(--muted); }
    .fail { color: var(--error); font-weight: 500; }
    .pass { color: var(--success); font-weight: 500; }
    .na { color: var(--muted); }
    @media (max-width: 640px) {
      article { margin: 0; padding: 24px 16px 40px; border: 0; border-radius: 0; }
    }
  </style>
</head>
<body>
  <div class="bar">
    Review report
    <!-- optional: local serve note -->
  </div>
  <article>
    <!-- fill from findings.md using templates.md — do not invent findings -->
  </article>
</body>
</html>
